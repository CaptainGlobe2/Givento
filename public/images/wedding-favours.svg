<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
      <defs>
        <filter id="sticker-shadow-20">
          <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2D1527" flood-opacity="0.15"/>
        </filter>
      </defs>
      <g filter="url(#sticker-shadow-20)">
        <rect x="40" y="60" width="120" height="100" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12"/>
        <rect x="45" y="70" width="110" height="90" rx="6" fill="#FFFDF8" stroke="#2D1527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Hamper lid / ribbon -->
        <rect x="42" y="62" width="116" height="16" rx="4" fill="#C59B27" stroke="#2D1527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="94" y="62" width="12" height="98" fill="#7A1C30"/>
        
        <!-- Big gold bow -->
        <circle cx="100" cy="62" r="5" fill="#D4AF37" stroke="#2D1527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 100 62 C 80 45 70 58 92 62 C 100 62 100 62 100 62 C 100 62 100 62 108 62 C 130 58 120 45 100 62 Z" fill="#D4AF37" stroke="#2D1527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Gift tag pinned -->
        <rect x="62" y="95" width="45" height="30" rx="2" fill="#FEF08A" stroke="#2D1527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 85 110)"/>
        <text x="85" y="108" font-family="cursive" font-size="6.5" fill="#7A1C30" text-anchor="middle">Thank You ♥</text>
        <text x="85" y="118" font-family="sans-serif" font-size="5" fill="#2D1527" text-anchor="middle">Wedding Favours</text>
      </g>
    </svg>